<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#143c38"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <meta name="description" content="一方水、一池錦鯉。可觸摸、投餵與探索的即時 WebGL 日式池塘。"/>
  <title>錦 KIN — A moment of stillness</title>
  <!-- Critical: paint loading screen before JS/CSS modules arrive -->
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#183d35;color:#f2f1df}
    #loading{
      position:absolute;inset:0;z-index:10;
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      background:radial-gradient(ellipse at 35% 25%,#9fbbb0 0%,#739b8f 48%,#426f66 100%);
    }
    #loading>span{font:72px "PMingLiU","Noto Serif TC",serif;color:#e2e9dc;text-shadow:0 3px 24px #153d3566}
    #loading p{font:17px "PMingLiU","Noto Serif TC",serif;letter-spacing:5px;margin:27px 0 20px;color:#e0e8db}
    #loading small{font-size:8px;letter-spacing:3px;color:#c4d4c8}
  </style>
</head>
<body>
  <main id="app">
    <canvas id="pond" aria-label="互動錦鯉池，可移動、輕觸、長按水面或投餵"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <span>錦</span>
      <p>讓心，慢下來。</p>
      <small>PREPARING YOUR POND</small>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
